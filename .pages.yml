# Pages CMS — https://pagescms.org
# Edit this site from a browser (including a phone) at https://app.pagescms.org.
# Pages CMS commits straight to this repo; Cloudflare rebuilds on push.
# There is no database: the markdown files here stay the source of truth.
#
# Two kinds of content, two kinds of editor:
#
#   rich-text  — for files that are plain markdown (new blog posts, the home
#                page). Nice WYSIWYG editing.
#   code       — for files carrying raw HTML: the posts ported from Notion,
#                the home archive, and the resume. Markdown can't express
#                what Notion nests (toggles, tables, callouts, embeds, colour
#                spans, the heading ids the table of contents links to), and
#                the rich-text editor DELETES that HTML on save — one edit
#                silently strips a post's formatting and breaks its TOC.
#                `code` preserves the file byte-for-byte.
#
# New posts go in src/content/blog (rich-text). The ported ones live in
# src/content/blog-notion and keep the same /blog/<name> URLs.

media:
  input: public/images
  output: /images

content:
  # ── Blog ──────────────────────────────────────────────────────────
  - name: posts
    label: Blog posts
    type: collection
    path: src/content/blog
    filename: '{fields.title}.md'
    view:
      primary: title
      sort: [date, title]
      order: desc
      fields: [title, date]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: icon
        label: Icon (emoji)
        type: string
        description: Shows on the blog card and above the post title, e.g. 📖
      - name: cover
        label: Cover image
        type: image
        description: Wide banner behind the post title, and the blog card image.
      - name: body
        label: Body
        type: rich-text

  # ── Blog posts ported from Notion ─────────────────────────────────
  # These carry raw HTML for things markdown can't express (toggles,
  # tables, callouts, embeds). The rich-text editor deletes that HTML on
  # save, so they are edited raw. Same URLs as the posts above.
  - name: posts-notion
    label: Blog posts (from Notion)
    type: collection
    path: src/content/blog-notion
    filename: '{fields.title}.md'
    view:
      primary: title
      sort: [date, title]
      order: desc
      fields: [title, date]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: icon
        label: Icon (emoji)
        type: string
        description: Shows on the blog card and above the post title, e.g. 📖
      - name: cover
        label: Cover image
        type: image
        description: Wide banner behind the post title, and the blog card image.
      - name: body
        label: Body (contains HTML — edit raw)
        type: code
        options:
          language: markdown

  # ── Home: the live "what I'm up to" ───────────────────────────────
  - name: now
    label: Home — currently working on
    type: file
    path: src/content/now/current.md
    fields:
      - name: date
        label: Last updated
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: body
        label: Body
        type: rich-text
        description: >-
          Use Heading 3 for each section. Body copy renders gray automatically.

  # ── Home: past versions, shown in the Archive toggle ──────────────
  - name: now-archive
    label: Home — archive
    type: collection
    path: src/content/now/archive
    filename: '{fields.date}.md'
    view:
      primary: date
      sort: [date]
      order: desc
      fields: [date, update]
    fields:
      - name: date
        label: Date this version was live
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: update
        label: Update note
        type: string
        description: >-
          Optional. What happened since — shown in italics above this snapshot.
          e.g. "Hit the 90lb weighted pull-up for 5 ✅"
      - name: body
        label: Body
        type: rich-text

  # ── Resume ────────────────────────────────────────────────────────
  - name: resume
    label: Resume
    type: file
    path: src/pages/resume.md
    fields:
      - name: layout
        label: Layout
        type: string
        hidden: true
      - name: title
        label: Title
        type: string
      - name: active
        label: Nav highlight
        type: string
        hidden: true
      - name: body
        label: Body
        type: rich-text

settings:
  content:
    merge: true
